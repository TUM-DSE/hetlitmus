[project]
site_name = "HetLitmus"
site_description = "Generation of CPU-GPU heterogeneous litmus tests for real hardware"
site_url = "https://tum-dse.github.io/hetlitmus/"
repo_url = "https://github.com/TUM-DSE/hetlitmus"
repo_name = "TUM-DSE/hetlitmus"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/quick-start.md",
  ] },
  { "User guide" = [
    "guide/index.md",
    "guide/test-format.md",
    "guide/corpora.md",
    "guide/generating-tests.md",
    "guide/compiling-tests.md",
    "guide/running-on-hardware.md",
    "guide/tuning-stress.md",
  ] },
  { "Architecture" = "architecture.md" },
  { "Reference" = [
    "reference/index.md",
    "reference/hetgen7.md",
    "reference/litmus7.md",
    "reference/scripts.md",
    "reference/runtime-settings.md",
  ] },
  { "About" = "about/index.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/cpu"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/TUM-DSE/hetlitmus"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
